
# name of the properties file we need from the git repository, through the config server:
#spring.application.name=chunk-chat
# OR
spring.cloud.config.name=microservice-x

# Profile setting - this will be used for fetching the proper config from the config server
# Current profiles: dev, qa.
#spring.profiles.active=dev
# OR
spring.cloud.config.profile=dev


# spring cloud client configuration
# get configuration from config server running on localhost and port 8888
spring.config.import=optional:configserver:http://localhost:8888

# test config client variables
test-config.config1=config1
test-config.config2=config2

# https://docs.spring.io/spring-boot/docs/current/reference/html/application-properties.html
#server.port=8081   # default port is 8080

# DB connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/chatdb
#spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=postgres
# Password for win8:
spring.datasource.password=qwe123
# Password for win11:
#spring.datasource.password=Qwe123

# JPA
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# API Documentation     [ https://springdoc.org/properties.html ]
springdoc.swagger-ui.path=/apis
#springdoc.packages-to-scan=*
springdoc.show-actuator=true
springdoc.model-and-view-allowed=true
springdoc.writer-with-default-pretty-printer=true
