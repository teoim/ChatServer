<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
<!--    <meta th:name="${_csrf.parameterName}" th:content="${_csrf.token}"/>-->
    <title>Dashboard - ChatServer srl</title>
    <link rel="stylesheet" type="text/css" href="/css/main.css" />
    <link rel="stylesheet" type="text/css" href="/css/dashboard.css" />
    <link rel="stylesheet" type="text/css" href="/css/userSearchResults.css" />

    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
    <script src="/webjars/sockjs-client/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/stomp.min.js"></script>
    <script type="text/javascript" src="/js/WebSockets.js"></script>
    <script type="text/javascript" src="/js/wss-mempool.js"></script>
    <script type="text/javascript" src="/js/WebRTC.js"></script>
    <script type="text/javascript" src="/js/WebRTCDataChannels.js"></script>
    <script type="text/javascript" src="/js/searchUsers.js"></script>
    <script type="text/javascript" src="/js/dashboard.js"></script>
</head>

<body>

    <div id="mainDiv">

        <header id="pageHeader">
            <h1>Chat DASHBOARD</h1>
            <h2> Welcome, <span id="emailSpan" th:text="${email}"/> - <span th:text="${role}"/></h2>
            <!--            <h2> Welcome, <span id="emailSpan" th:text="${email}"/> - <span th:text="|${role} - objects in session: ${session.size()}|"/> </h2>-->
<!--            <h2> <span id="emailSpan" th:text="|${welcomeMessage} - ${role}|"/> </h2>-->
<!--            <h3> <span id="bioSpan" th:text="${session.bio}"/> </h3>-->

            <form id="logoutForm" action="#" th:action="@{/logout}" method="post">
                <input id="logoutBtn" type="submit" value="Logout"/>
            </form>
        </header>

        <div id="friendList" class="middleDivs">
            <div id="searchDiv">
                <h1>Contacts:</h1>
                <label>
                    <input id="searchInput" type="search" placeholder="Search users...">
                </label>
<!--                <div id="searchResultsDiv">-->
<!--                </div>-->
            </div>

            <article class="friendsListArticle">
                <a href="#" class="friendsAnchor"><h3 id="friendsListGeneralH3">General</h3></a>
            </article>
            <article th:each="friend : ${session.friendsList}" class="friendsListArticle">
                <a href="#" class="friendsAnchor"><h3 class="friendsListH3" th:text="${friend}"> </h3></a>
            </article>
        </div>


        <div id="chatScreen" class="middleDivs">
            <div id="searchResultsDiv">
            </div>
            <input type="hidden" id="iAmChattingWith" value=""/>

<!--            <form>-->
                <!-- CSRF token hidden field -->

            <div id="iconsDiv">
                <div id="callIconDiv" class="innerDivsCallAndVideo">
                    <img id="callIcon" class="callIcons" src="/images/icons/call.png" alt="Start voice call.">
                </div>
                <div id="videoCallIconDiv" class="innerDivsCallAndVideo">
                    <img id="videoCallIcon" class="callIcons" src="/images/icons/videocall.png" alt="Start video call.">
                </div>

                <div id="addFriendIconDiv" class="innerDivsCallAndVideo">
                    <a href="#">
                        <img id="addFriendIcon" class="userIcons" src="/images/icons/add-user-50.png" alt="Add friend.">
                    </a>
                </div>
                <div id="blockUserIconDiv" class="innerDivsCallAndVideo">
                    <a href="#">
                        <img id="blockUserIcon" class="userIcons" src="/images/icons/block-user-50.png" alt="Block user.">
                    </a>
                </div>
            </div>
<!--            </form>-->

            <div id="videoBox">
                <video id="bigScreen" autoplay playsinline></video>
                <video id="smallScreen" autoplay playsinline muted></video>
<!--                <a hidden><h6 id="videoAndCallTargetId" th:text="${session.iAmChattingWith}"></h6></a>-->

                <div id="inCallIconsDiv">
                    <div id="innerCallDiv" class="inCallInnerDivClass">
                        <img id="innerCallIcon" class="callIcons inCallIcons" src="/images/icons/call.png" alt="End voice call.">
                    </div>

                    <div id="innerVideoCallDiv" class="inCallInnerDivClass">
                        <img id="innerVideoCallIcon" class="callIcons inCallIcons" src="/images/icons/videocall.png" alt="End video call.">
                    </div>

                    <div id="innerCameraOnDiv" class="inCallInnerDivClass">
                        <img id="innerCameraOnIcon" class="callIcons inCallIcons inCallIconsOn" src="/images/icons/camera-on.png" alt="Turn camera off.">
                    </div>

                    <div id="innerCameraOffDiv" class="inCallInnerDivClass">
                        <img id="innerCameraOffIcon" class="callIcons inCallIcons inCallIconsOff" src="/images/icons/camera-off.png" alt="Turn camera on.">
                    </div>

                    <div id="innerMicOnDiv" class="inCallInnerDivClass">
                        <img id="innerMicOnIcon" class="callIcons inCallIcons inCallIconsOn" src="/images/icons/mic-on.png" alt="Turn microphone off.">
                    </div>

                    <div id="innerMicOffDiv" class="inCallInnerDivClass">
                        <img id="innerMicOffIcon" class="callIcons inCallIcons inCallIconsOff" src="/images/icons/mic-off.png" alt="Turn microphone on.">
                    </div>

                </div>
            </div>

            <div id="chattingWithDiv">
                <img id="chattingWithIcon" src="" alt="">
                <h3 id="chattingWithH3">
                    General Chat
                </h3>
            </div>

            <div id="chatBox">

<!--                <article id="dummyArticle" class="chatArticle general">
                    <header class="messageTimeHeader">
                        <time> <h3> From: someone@whatever.com, 12:55:32 </h3> </time>
                    </header>

                    <p class="chatP"> <h1>TEST article in div chatBox </h1> </p>

                    <footer class="messageDateFooter">
                        <date> <h3> Sut Jul 15 2023 </h3> </date>
                    </footer>
                </article>
-->

                <div id="filePreviewDiv">
                    <input type="button" id="sendFilesBtn" value="Send">
                </div>
            </div>


            <!-- form id="sendTextForm" action="sendText" method="post" enctype="text/plain"-->
            <form id="sendTextForm" enctype="text/plain">
                <label id="fileInputLabel" for="fileInput">
                    <img id="attachFilesIcon" src="/images/icons/photo-gallery-70.png"/>
                    <!--  https://www.a11yproject.com/posts/how-to-hide-content/  -->
                    <input type="file" id="fileInput" name="fileInput" multiple accept="image/*"/>
                </label>

                <input type="text" id="writeText" placeholder="Write something...">

                <!-- CSRF token hidden field -->
                <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

                <input type="button" id="submitBtn" value=">>">
            </form>

        </div>

    </div>

    
    <footer id="pageFooter" hidden>
        <p id="footerTitleP">
            <a href="https://mempool.space" target="_blank">mempool fees(sats/vB)</a>
        </p>
        <article id="fastestFee" class="feesArticles"><h4>prio</h4><p id="p1">-</p></article>
        <article id="halfHourFee" class="feesArticles"><h4>1/2h</h4><p id="p2">-</p></article>
        <article id="hourFee" class="feesArticles"><h4>1h</h4><p id="p3">-</p></article>
        <article id="economyFee" class="feesArticles"><h4>econ</h4><p id="p4">-</p></article>
        <article id="minimumFee" class="feesArticles"><h4>min</h4><p id="p5">-</p></article>

        <article id="conversionsArticle">
            <label for="conversionsEntries">1BTC /</label>
            <select id="conversionsEntries"></select>
            <p id="btcPrice">: ------ </p>
            <p id="btcPriceTime">@ --:--:-- </p>
        </article>
    </footer>

</body>
</html>
