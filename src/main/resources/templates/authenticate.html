<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Authenticate - ChatServer srl</title>
    <link rel="stylesheet" type="text/css" href="/css/login.css" />
    <link rel="stylesheet" type="text/css" href="/css/main.css" />
    <link rel="stylesheet" type="text/css" href="/css/commonNotMain.css" />
    <script type="text/javascript" src="/js/authenticate.js"></script>

    <script type="text/javascript" src="/js/wss-mempool.js"></script>

</head>
<body>

    <h1 id="h1PleaseLogIn"><span id="spanPlease">Please</span> <span id="spanLogIn">Log In</span></h1>
    <div th:if="${param.error}">
        Invalid username and password.
    </div>
    <div th:if="${param.logout}">
        You have been logged out.
    </div>

    <form th:action="@{/api/auth/authenticate-post}" method="post">
        <div class="formDiv">
            <label class="fl">Email/Username
                <input type="email" id="username" class="fi common" name="username" required>
            </label>
        </div>
        <div class="formDiv">
            <label class="fl">Password
                <input type="password" id="password" class="fi common" name="password" required>
            </label>
        </div>

        <!-- CSRF token hidden field -->
        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}"/>

        <div id="divSmBn" class="formDiv">
            <input type="submit" id="submitBtn" value="Login">
            <a id="registerLink" th:href="@{/api/auth/register}">Register</a>
        </div>
    </form>

    <div>
        <p><a th:href="@{/dashboard}">Dashboard</a></p>
<!--        <p><a th:href="@{/api/auth/register}">Register</a></p>-->
    </div>


    <footer id="pageFooter">
        <p id="footerTitleP">
            <a href="https://mempool.space" target="_blank">mempool fees(sats/vB)</a>
        </p>
        <article id="fastestFee" class="feesArticles"><h4>prio</h4><p id="p1">-</p></article>
        <article id="halfHourFee" class="feesArticles"><h4>1/2h</h4><p id="p2">-</p></article>
        <article id="hourFee" class="feesArticles"><h4>1h</h4><p id="p3">-</p></article>
        <article id="economyFee" class="feesArticles"><h4>econ</h4><p id="p4">-</p></article>
        <article id="minimumFee" class="feesArticles"><h4>min</h4><p id="p5">-</p></article>

        <article id="conversionsArticle">
            <label for="conversionsEntries">1BTC /</label>
            <select id="conversionsEntries"></select>
            <p id="btcPrice">: ------ </p>
            <p id="btcPriceTime">@ --:--:-- </p>
        </article>
    </footer>

</body>
</html>
