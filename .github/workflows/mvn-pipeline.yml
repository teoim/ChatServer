#
# This workflow will build the project with Maven, on a self-hosted runner, and cache/restore any dependencies to improve the
# workflow execution time.
# It will then copy the jar file to the deployment folder and run the app.
#
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven
#
name: Java CI/CD test with Maven

on:
  push:
    branches: [ "fb-web-app-web-rtc-cors" ]
    # pull_request:
    # branches: [ "fb-web-app" ]

jobs:
  build:
    runs-on: self-hosted

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
      - name: Clear deployments directory
        run: rm /home/teo/deployments/chat-app/*.jar
      - name: Copy new jar to deployments directory
        run: cp /home/teo/repos/ChatServer/target/*.jar /home/teo/deployments/chat-app/
      - name: chmod on jar file
        run: chmod 777 /home/teo/deployments/chat-app/chat-app-*.jar

  run:
    runs-on: self-hosted
    needs: [build, deploy]

    steps:
      - name: Run application
        run: java -jar /home/teo/deployments/chat-app/chat-app-0.1. &